<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3D 주사위 확률 실험실</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1d2433;--mu:#6b7385;--bd:#e3e6ee;--ac:#4f6df5;--ac2:#e5484d;--bar:#4f6df5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151d;--card:#1c212d;--tx:#eef0f6;--mu:#9aa3b8;--bd:#2c3344;--ac:#7b93ff;--ac2:#ff7a7f;--bar:#7b93ff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12151d;--card:#1c212d;--tx:#eef0f6;--mu:#9aa3b8;--bd:#2c3344;--ac:#7b93ff;--ac2:#ff7a7f;--bar:#7b93ff;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px}
#stage{width:100%;height:clamp(220px,48vw,320px);border-radius:10px;overflow:hidden;background:linear-gradient(#dfe5f7,#c9d2ee)}
#stage canvas{display:block;width:100%;height:100%}
.res{text-align:center;margin:10px 0;color:var(--mu);font-size:15px}
.res b{color:var(--tx);font-size:22px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--ac);color:#fff;cursor:pointer;font-weight:600}
button.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}
button.danger{background:var(--ac2)}
button:disabled{opacity:.45;cursor:not-allowed}
.cus{display:flex;gap:6px;align-items:center}
input{font:inherit;width:100px;padding:9px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:8px;text-align:center;border-bottom:1px solid var(--bd)}
th{color:var(--mu);font-weight:600}
tfoot td{font-weight:700;border-bottom:0}
.chart{position:relative;height:210px;display:flex;align-items:flex-end;gap:10px;padding:18px 6px 0;border-bottom:2px solid var(--bd)}
.col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.bar{width:100%;background:var(--bar);border-radius:6px 6px 0 0;min-height:2px;transition:height .15s}
.val{font-size:12px;color:var(--mu);margin-bottom:3px}
.ref{position:absolute;left:0;right:0;border-top:2px dashed var(--ac2);pointer-events:none}
.ref span{position:absolute;right:0;top:-18px;font-size:11px;color:var(--ac2)}
.lab{display:flex;gap:10px;padding:6px 6px 0}.lab div{flex:1;text-align:center;font-weight:700}
.note{font-size:12px;color:var(--mu);margin-top:8px}
html{-webkit-text-size-adjust:100%}
button{touch-action:manipulation}
@media(max-width:560px){.wrap{padding:10px}h1{font-size:19px}.card{padding:12px}.btns button{flex:1 1 28%;min-height:46px;padding:12px 8px}.cus{flex:1 1 100%}.cus input{flex:1;width:auto;min-width:0;min-height:46px}.cus button{flex:0 0 auto;padding:12px 18px}#rs{flex:1 1 100%}.chart{height:170px;gap:6px}th,td{padding:6px}.res b{font-size:20px}}
</style>
</head>
<body>
<div class="wrap">
<h1>🎲 3D 주사위 확률 실험실</h1>
<div class="grid">
  <div class="card">
    <div id="stage"></div>
    <div class="res">마지막 결과: <b id="last">-</b></div>
    <div class="btns">
      <button id="b1">1회</button>
      <button id="b10">10회</button>
      <button id="b100">100회</button>
      <span class="cus"><input id="n" type="number" min="1" max="100000" value="1000" aria-label="사용자 지정 횟수"><button id="bc">굴리기</button></span>
      <button id="rs" class="danger">초기화</button>
    </div>
    <div class="note">사용자 지정은 1~100,000회까지 가능합니다.</div>
  </div>
  <div class="card">
    <table>
      <thead><tr><th>눈</th><th>횟수</th><th>백분율</th></tr></thead>
      <tbody id="tb"></tbody>
      <tfoot><tr><td>합계</td><td id="tt">0</td><td id="tp">0.00%</td></tr></tfoot>
    </table>
  </div>
</div>
<div class="card" style="margin-top:14px">
  <div style="font-weight:700;margin-bottom:4px">눈별 출현 비율 (%)</div>
  <div class="chart" id="ch"><div class="ref" id="rf"><span>이론값 16.67%</span></div></div>
  <div class="lab" id="lb"></div>
</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const counts=[0,0,0,0,0,0];let total=0,busy=false,spin=false,anim=null;
const $=id=>document.getElementById(id);
// 표/차트 초기 구성
for(let i=1;i<=6;i++){
  $('tb').insertAdjacentHTML('beforeend',`<tr><td>${i}</td><td id="c${i}">0</td><td id="p${i}">0.00%</td></tr>`);
  $('ch').insertAdjacentHTML('beforeend',`<div class="col"><div class="val" id="v${i}">0%</div><div class="bar" id="r${i}" style="height:0"></div></div>`);
  $('lb').insertAdjacentHTML('beforeend',`<div>${i}</div>`);
}
function render(){
  const pc=counts.map(c=>total?c/total*100:0);
  const sc=Math.max(30,Math.ceil(Math.max(...pc)/5)*5+5);
  for(let i=1;i<=6;i++){
    $('c'+i).textContent=counts[i-1].toLocaleString();
    $('p'+i).textContent=pc[i-1].toFixed(2)+'%';
    $('v'+i).textContent=pc[i-1].toFixed(1)+'%';
    $('r'+i).style.height=(pc[i-1]/sc*100)+'%';
  }
  $('tt').textContent=total.toLocaleString();
  $('tp').textContent=total?'100.00%':'0.00%';
  // 이론값 기준선 (차트 영역: 상단 18px 여백 제외)
  const h=$('ch').clientHeight-18;
  $('rf').style.bottom=(h*(100/6)/sc)+'px';
}
// ---- Three.js ----
const stage=$('stage');
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
stage.appendChild(renderer.domElement);
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(40,1,.1,50);cam.position.set(0,3.2,6);cam.lookAt(0,.3,0);
scene.add(new THREE.AmbientLight(0xffffff,.75));
const dl=new THREE.DirectionalLight(0xffffff,.8);dl.position.set(3,6,4);scene.add(dl);
const PIPS={1:[[.5,.5]],2:[[.25,.25],[.75,.75]],3:[[.25,.25],[.5,.5],[.75,.75]],4:[[.25,.25],[.75,.25],[.25,.75],[.75,.75]],5:[[.25,.25],[.75,.25],[.5,.5],[.25,.75],[.75,.75]],6:[[.25,.25],[.75,.25],[.25,.5],[.75,.5],[.25,.75],[.75,.75]]};
function faceTex(n){
  const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d');
  g.fillStyle='#fdfdfb';g.fillRect(0,0,128,128);g.strokeStyle='#d6d9e2';g.lineWidth=6;g.strokeRect(3,3,122,122);
  g.fillStyle='#1d2433';
  PIPS[n].forEach(([x,y])=>{g.beginPath();g.arc(x*128,y*128,n===1?17:12,0,7);g.fill()});
  return new THREE.CanvasTexture(c);
}
// BoxGeometry 재질 순서: +x,-x,+y,-y,+z,-z (마주 보는 면의 합 = 7)
const faceVal=[3,4,1,6,2,5];
const normals={3:[1,0,0],4:[-1,0,0],1:[0,1,0],6:[0,-1,0],2:[0,0,1],5:[0,0,-1]};
const dice=new THREE.Mesh(new THREE.BoxGeometry(2,2,2),faceVal.map(v=>new THREE.MeshStandardMaterial({map:faceTex(v),roughness:.45})));
scene.add(dice);
function highlight(v){faceVal.forEach((fv,i)=>{const m=dice.material[i],on=v&&fv===v;m.color.set(v?(on?0xffffff:0x9aa0b0):0xffffff);m.emissive.set(on?0x5a4a00:0x000000)})}
const UP=new THREE.Vector3(0,1,0);
function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
addEventListener('resize',()=>{resize();render()});resize();
function rollTo(v,dur){
  return new Promise(res=>{
    const n=new THREE.Vector3(...normals[v]);
    const toCam=cam.position.clone().normalize();
    const q1=new THREE.Quaternion().setFromAxisAngle(UP,.55).multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1,0,0),.35)).multiply(new THREE.Quaternion().setFromAxisAngle(toCam,Math.floor(Math.random()*4)*Math.PI/2)).multiply(new THREE.Quaternion().setFromUnitVectors(n,toCam));
    highlight(0);
    anim={t0:performance.now(),dur,q0:dice.quaternion.clone(),q1,
      axis:new THREE.Vector3(Math.random()-.5,Math.random()-.5,Math.random()-.5).normalize(),
      ang:Math.PI*(4+Math.random()*3),v,res};
  });
}
const tmp=new THREE.Quaternion(),sa=new THREE.Vector3(1,.7,.3).normalize();
(function loop(now){
  requestAnimationFrame(loop);
  if(anim){
    const p=Math.min(1,(now-anim.t0)/anim.dur),e=1-Math.pow(1-p,3);
    const q=anim.q0.clone().slerp(anim.q1,e);
    tmp.setFromAxisAngle(anim.axis,(1-e)*anim.ang);
    dice.quaternion.copy(tmp.multiply(q));
    dice.position.y=Math.abs(Math.sin(p*Math.PI*3))*(1-p)*1.3;
    if(p>=1){dice.position.y=0;const r=anim.res;highlight(anim.v);anim=null;r()}
  }else if(spin){
    tmp.setFromAxisAngle(sa,.18);dice.quaternion.premultiply(tmp);
    dice.position.y=.3+Math.abs(Math.sin(now/120))*.6;
  }
  renderer.render(scene,cam);
})(0);
// ---- 실험 로직 ----
const rnd=()=>Math.floor(Math.random()*6)+1;
function lock(b){busy=b;document.querySelectorAll('button').forEach(x=>{if(x.id!=='rs')x.disabled=b})}
async function single(){
  if(busy)return;lock(true);
  const v=rnd();await rollTo(v,1100);
  counts[v-1]++;total++;$('last').textContent=v;render();lock(false);
}
async function bulk(n){
  if(busy)return;n=Math.max(1,Math.min(100000,Math.floor(n)||0));
  lock(true);highlight(0);spin=true;let done=0,last=1;
  const batch=Math.max(1,Math.ceil(n/50));
  await new Promise(res=>{
    (function step(){
      if(!busy){res();return}
      const k=Math.min(batch,n-done);
      for(let i=0;i<k;i++){last=rnd();counts[last-1]++;total++}
      done+=k;render();
      if(done<n)setTimeout(step,30);else res();
    })();
  });
  spin=false;
  if(busy){await rollTo(last,900);$('last').textContent=last}
  lock(false);
}
function reset(){
  busy=false;spin=false;anim=null;counts.fill(0);total=0;$('last').textContent='-';
  dice.position.y=0;dice.quaternion.identity();highlight(0);render();lock(false);
}
$('b1').onclick=single;
$('b10').onclick=()=>bulk(10);
$('b100').onclick=()=>bulk(100);
$('bc').onclick=()=>bulk(+$('n').value);
$('rs').onclick=reset;
dice.quaternion.setFromEuler(new THREE.Euler(.5,.7,0));
render();
</script>
</body>
</html>
